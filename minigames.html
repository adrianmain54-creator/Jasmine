  .brand h1 { margin: 0; font: 400 clamp(3rem, 11vw, 6.4rem)/0.9 var(--display); letter-spacing: -0.01em; }
  .top-right { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }

  .shuffle { background: var(--petal); color: var(--night); border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 600; font-size: 0.92rem; cursor: pointer; transition: transform 0.15s, background 0.15s; }

  .tile .best { position: absolute; left: 12px; top: 12px; padding: 5px 9px; border-radius: 99px; font: 600 0.72rem/1 var(--body); background: var(--chip, rgba(0, 0, 0, 0.12)); font-variant-numeric: tabular-nums; }

  .ctrl:empty { display: none; }

  .board { position: relative; container-type: size; flex: none; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }

  }
